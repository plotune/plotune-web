  <!-- Cookie consent (src/consent.js, banner in src/components/CookieConsent.jsx). The choice is
       kept in localStorage "plotune_consent" as {"v":2,"analytics":bool,"ads":bool}; keep the key and
       version here in step with src/consent.js (any other version counts as no choice). Google Consent
       Mode v2 starts denied; analytics_storage follows "analytics", the three ad signals follow "ads",
       and the LinkedIn Insight Tag is loaded only when "ads" is true. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    window.__plotuneConsent = null;
    try {
      var storedConsent = JSON.parse(window.localStorage.getItem('plotune_consent'));
      if (storedConsent && storedConsent.v === 2 && typeof storedConsent.analytics === 'boolean' && typeof storedConsent.ads === 'boolean') {
        window.__plotuneConsent = { analytics: storedConsent.analytics, ads: storedConsent.ads };
      }
    } catch (e) { /* storage blocked: treated as no choice yet */ }
    // Consent Mode v2 defaults, before the Google tag's config runs.
    gtag('consent', 'default', { ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied', analytics_storage: 'denied' });
    gtag('set', 'ads_data_redaction', true);
    if (window.__plotuneConsent && (window.__plotuneConsent.analytics || window.__plotuneConsent.ads)) {
      var adsState = window.__plotuneConsent.ads ? 'granted' : 'denied';
      gtag('consent', 'update', { ad_storage: adsState, ad_user_data: adsState, ad_personalization: adsState, analytics_storage: window.__plotuneConsent.analytics ? 'granted' : 'denied' });
    }
  </script>

  <!-- Google tag (gtag.js) for Google Ads conversion tracking (AW-18495931723). The conversions

  <!-- LinkedIn Insight Tag: loaded only after the visitor allows advertising cookies (now, from a
       remembered choice, or later by src/consent.js). Until then window.lintrk does not exist, so LinkedIn
       conversion calls are no-ops. -->
  <script type="text/javascript">
    _linkedin_partner_id = "10933481";
    window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || [];
    window._linkedin_data_partner_ids.push(_linkedin_partner_id);
    window.plotuneLoadLinkedIn = function () {
      if (window.__plotuneLinkedInLoaded) return;
      window.__plotuneLinkedInLoaded = true;
      (function (l) {
        if (!l) {
          window.lintrk = function (a, b) { window.lintrk.q.push([a, b]); };
          window.lintrk.q = [];
        }
        var s = document.getElementsByTagName("script")[0];
        var b = document.createElement("script");
        b.type = "text/javascript";
        b.async = true;
        b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js";
        s.parentNode.insertBefore(b, s);
      }(window.lintrk));
    };
    if (window.__plotuneConsent && window.__plotuneConsent.ads === true) window.plotuneLoadLinkedIn();
  </script>
