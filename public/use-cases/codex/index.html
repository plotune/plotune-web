<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex Use Cases — Plotune Nexus</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="codex-terminal.css">
</head>
<body class="followup-shell">
<div class="window window-followup">
  <div class="titlebar">
    <div class="titlebar-center">OpenAI Codex</div>
  </div>
  <div class="term" id="term"></div>
  <div class="bottombar">
    <button class="stab active" data-title="OpenAI Codex · Brake ECU" data-directory="~/brk-219-release" onclick="sel(0)">1  Brake ECU</button>
    <button class="stab" data-title="OpenAI Codex · Inverter" data-directory="~/inv-0426-calibration" onclick="sel(1)">2  Inverter</button>
    <button class="stab" data-title="OpenAI Codex · Charger" data-directory="~/chg-77-service" onclick="sel(2)">3  Charger</button>
    <button class="stab" data-title="OpenAI Codex · Endurance" data-directory="~/r42-endurance-signoff" onclick="sel(3)">4  Endurance</button>
    <button class="breplay" onclick="replay()">Replay</button>
  </div>
</div>
<script src="codex-terminal-runtime.js"></script>
<script src="codex-demo-followup-scenarios.js"></script>
</body>
</html>
