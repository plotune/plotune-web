<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Single Page Apps for GitHub Pages: restore the real path after the 404.html redirect. -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    }(window.location));
  </script>

  <!--
    Per-route <title>, description, canonical, and og:title/description/url are
    supplied at runtime by react-helmet-async (see src/components/Seo.jsx), so
    they are intentionally NOT duplicated here. This file keeps only the global,
    non-varying tags plus a homepage-default title fallback for non-JS crawlers.
  -->
  <title>Plotune: DataOps Platform &amp; AI-Ready Test Systems</title>
  <meta name="keywords" content="Plotune, DataOps platform, data orchestration, data governance, Plotune Nexus, test automation, hardware-in-the-loop, MCP, AI workflows">
  <meta name="author" content="Plotune">
  <meta name="theme-color" content="#26A69A">

  <!-- Open Graph (global, non-varying) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Plotune">
  <meta property="og:image" content="https://www.plotune.net/logo512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">

  <!-- Twitter (global, non-varying) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://www.plotune.net/logo512.png">

  <link rel="icon" href="%PUBLIC_URL%/assets/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png">
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://www.plotune.net/#organization",
        "name": "Plotune",
        "url": "https://www.plotune.net/",
        "logo": "https://www.plotune.net/logo512.png",
        "description": "Plotune is a data operations company that helps engineering teams orchestrate, process, and govern their data. It also builds Plotune Nexus, a managed appliance that brings the same controlled, AI-ready workflows to real test hardware."
      },
      {
        "@type": "WebSite",
        "@id": "https://www.plotune.net/#website",
        "url": "https://www.plotune.net/",
        "name": "Plotune",
        "description": "A DataOps platform for orchestrating and governing data, plus Plotune Nexus, a local-first appliance that brings controlled, AI-ready workflows to real test hardware.",
        "publisher": { "@id": "https://www.plotune.net/#organization" }
      },
      {
        "@type": "SoftwareApplication",
        "name": "Plotune DataOps Platform",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Linux, Windows",
        "url": "https://www.plotune.net/",
        "publisher": { "@id": "https://www.plotune.net/#organization" },
        "description": "The Plotune DataOps platform (Core, Stream, and Cloud) gives teams a single way to move, process, and govern data across their tools. It is designed for repeatable, auditable workflows rather than one-off scripts."
      },
      {
        "@type": "Product",
        "name": "Plotune Nexus",
        "brand": { "@id": "https://www.plotune.net/#organization" },
        "url": "https://www.plotune.net/nexus",
        "description": "Plotune Nexus is a managed, local-first appliance on Plotune-defined hardware that connects to real test systems and exposes bounded, AI-ready actions over a standard MCP surface. Captured data and artifacts stay local until the team chooses where to send them."
      }
    ]
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</body>
</html>
