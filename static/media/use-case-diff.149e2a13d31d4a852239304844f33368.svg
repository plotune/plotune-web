<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" fill="none">
  <style>
    .bg { fill: #121417; }
    .panel { fill: #171a1f; }
    .grid { stroke: rgba(143,155,168,0.14); stroke-width: 1; }
    .trace-a, .trace-b {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 420;
      stroke-dashoffset: 420;
    }
    .trace-a { stroke: #f59e0b; animation: drawA 4.4s ease-in-out infinite; }
    .trace-b { stroke: #26A69A; animation: drawB 4.4s ease-in-out infinite 0.35s; }
    .band { animation: scan 4.4s ease-in-out infinite; }
    .bar {
      transform-box: fill-box;
      transform-origin: left center;
      animation: bar 4.4s ease-in-out infinite;
    }
    .label { fill: #8f9ba8; font: 11px Inter, Arial, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
    .value { fill: #f5f5f5; font: 600 12px Inter, Arial, sans-serif; }
    .key { fill: #26A69A; font: 600 12px Inter, Arial, sans-serif; }
    @keyframes drawA {
      0%, 10% { stroke-dashoffset: 420; opacity: 0.4; }
      32%, 100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes drawB {
      0%, 18% { stroke-dashoffset: 420; opacity: 0.45; }
      38%, 100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes scan {
      0%, 10% { transform: translateX(-148px); opacity: 0; }
      28%, 82% { opacity: 1; }
      100% { transform: translateX(150px); opacity: 0; }
    }
    @keyframes bar {
      0%, 24% { transform: scaleX(0.16); }
      44%, 100% { transform: scaleX(0.92); }
    }
    @media (prefers-reduced-motion: reduce) {
      .trace-a, .trace-b, .band, .bar { animation: none !important; stroke-dashoffset: 0; transform: none !important; opacity: 1 !important; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="480" height="250" rx="22"/>
  <rect class="panel" x="18" y="18" width="288" height="168" rx="18"/>
  <rect class="panel" x="322" y="18" width="140" height="168" rx="18"/>
  <rect class="panel" x="18" y="202" width="444" height="30" rx="15"/>

  <g>
    <line class="grid" x1="42" y1="52" x2="282" y2="52"/>
    <line class="grid" x1="42" y1="82" x2="282" y2="82"/>
    <line class="grid" x1="42" y1="112" x2="282" y2="112"/>
    <line class="grid" x1="42" y1="142" x2="282" y2="142"/>
    <line class="grid" x1="42" y1="52" x2="42" y2="164"/>
    <line class="grid" x1="102" y1="52" x2="102" y2="164"/>
    <line class="grid" x1="162" y1="52" x2="162" y2="164"/>
    <line class="grid" x1="222" y1="52" x2="222" y2="164"/>
    <line class="grid" x1="282" y1="52" x2="282" y2="164"/>
  </g>
  <rect class="band" x="126" y="52" width="32" height="112" rx="10" fill="#26A69A" opacity="0.12"/>
  <path class="trace-a" d="M42 136 C76 122 98 78 126 86 C158 95 170 129 196 136 C222 143 238 118 262 102 C268 98 275 96 282 96"/>
  <path class="trace-b" d="M42 132 C78 120 92 88 126 92 C154 95 170 121 198 126 C224 131 242 116 262 104 C268 100 274 98 282 98"/>

  <text class="label" x="38" y="42">Baseline Diff</text>
  <text class="value" x="338" y="44">Candidate aligned</text>
  <text class="label" x="338" y="74">New IDs</text>
  <rect x="338" y="86" width="106" height="12" rx="6" fill="#222933"/>
  <rect class="bar" x="338" y="86" width="106" height="12" rx="6" fill="#26A69A"/>
  <text class="value" x="338" y="116">0 remaining</text>
  <text class="label" x="338" y="144">Latency delta</text>
  <text class="key" x="338" y="162">+0.1 ms</text>

  <text class="value" x="28" y="221">Baseline locked</text>
  <text class="value" x="164" y="221">Candidate replay matched</text>
  <text class="key" x="346" y="221">diff collapsed</text>
</svg>
