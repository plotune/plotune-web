<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Plotune</title>
  <!--
    Single Page Apps for GitHub Pages
    https://github.com/rafgraph/spa-github-pages (MIT)
    GitHub Pages serves this 404.html for unknown paths. It rewrites the
    requested deep link into a query string and redirects to the app, which
    restores the real path (see the restore script in index.html). This lets
    clean URLs like /nexus/use-cases resolve when opened or shared directly.
    pathSegmentsToKeep = 0 because the site is served at the domain root.
  -->
  <script type="text/javascript">
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
